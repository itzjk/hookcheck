[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookcheck"
version = "0.1.0"
description = "Audit the actual opening frames of Shorts, Reels and TikToks for swipe risk."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["youtube-shorts", "tiktok", "reels", "video", "retention", "creator-tools", "ffmpeg", "llm", "vision", "cli"]
dependencies = ["Pillow>=10.4,<13"]
classifiers = ["Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video"]

[project.urls]
Repository = "https://github.com/itzjk/hookcheck"
Issues = "https://github.com/itzjk/hookcheck/issues"

[project.scripts]
hookcheck = "hookcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
